name: Captura automática de resultados

on:
  schedule:
    # 04:00 UTC = 11:00 PM hora Colombia (COT, UTC-5 todo el año, sin
    # horario de verano). Corre una vez al día, pensado para llegar
    # después de los sorteos "Noche". GitHub puede retrasar workflows
    # programados unos minutos en horas de mucha carga; no afecta nada.
    - cron: '0 4 * * *'
  # Permite lanzarlo a mano desde la pestaña "Actions" del repositorio,
  # sin esperar al horario, para probarlo o forzar una corrida puntual.
  workflow_dispatch: {}

# Necesario para que el robot pueda subir el cambio de vuelta al
# repositorio. También hay que activar "Read and write permissions" en
# Settings -> Actions -> General -> Workflow permissions: este bloque de
# aquí no basta por sí solo si esa opción del repositorio está en
# solo-lectura (esa configuración manda por encima de lo que diga este
# archivo).
permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Correr la captura (mismo script que se corre en local)
        run: python capturar_resultados.py

      - name: Subir cambios si hay algo nuevo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # git add sobre un archivo que no existe corta el paso entero (los
          # steps de Actions corren con "set -e"). Se agrega uno por uno,
          # solo si existe, para que la subida nunca truene por esto de
          # nuevo -- pase lo que pase con la ubicación de los archivos.
          for f in captura_automatica.js captura_acumulada.json captura_estado.json; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d capturas ] && git add capturas/
          if git diff --cached --quiet; then
            echo "Sin resultados nuevos en esta corrida, nada que subir."
          else
            git commit -m "Captura automática: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # v30 -- Monitor: si la captura deja de traer resultados (el sitio cambió,
      # bloqueó al robot, etc.), la corrida termina en ROJO en vez de pasar en
      # silencio. GitHub avisa por correo cuando falla una tarea programada.
      # Va al final a propósito: lo que sí se haya capturado ya quedó subido.
      - name: Verificar que la captura siga trayendo resultados
        run: |
          python - <<'PY'
          import json, sys, datetime, pathlib
          ruta = pathlib.Path("captura_acumulada.json")
          if not ruta.exists():
              print("::error::No existe captura_acumulada.json: la captura nunca ha guardado resultados.")
              sys.exit(1)
          filas = json.loads(ruta.read_text(encoding="utf-8"))
          fechas = sorted({f.get("fecha", "") for f in filas if f.get("fecha")})
          if not fechas:
              print("::error::captura_acumulada.json está vacío.")
              sys.exit(1)
          ultima = datetime.date.fromisoformat(fechas[-1])
          hoy = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=5)).date()  # hora Colombia
          atraso = (hoy - ultima).days
          print(f"Último día capturado: {ultima} · hoy (Colombia): {hoy} · atraso: {atraso} día(s)")
          if atraso > 3:
              print(f"::error::La captura no trae resultados nuevos desde {ultima} ({atraso} días). Revisa si cambió el sitio de origen.")
              sys.exit(1)
          PY
